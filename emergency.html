<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKSHAK | EMERGENCY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Montserrat', sans-serif; }
        /* Background strobe effect for extreme urgency */
        @keyframes strobe {
            0%, 100% { background-color: #991b1b; }
            50% { background-color: #dc2626; }
        }
        .bg-strobe { animation: strobe 2s infinite; }
    </style>
</head>
<body class="bg-strobe text-white min-h-screen flex flex-col p-6 relative overflow-hidden">

    <!-- Siren Audio -->
    <audio id="siren-audio" loop src="/assets/alert-sound.mp3"></audio>

    <!-- Overlay pattern -->
    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_transparent_0%,_#000_100%)] pointer-events-none"></div>

    <div class="flex-grow flex flex-col items-center justify-center text-center relative z-10 w-full max-w-sm mx-auto">
        
        <!-- Animated Icon -->
        <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6 animate-[bounce_1s_infinite]">
            <span class="text-5xl">🚨</span>
        </div>

        <h1 class="font-display text-5xl font-black mb-2 tracking-tight text-white drop-shadow-lg">EMERGENCY</h1>
        <p class="text-lg font-medium mb-10 text-red-100">Immediate assistance required.</p>
        
        <!-- Data Card -->
        <div class="bg-white text-gray-900 w-full rounded-3xl p-8 shadow-2xl mb-8 relative">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Protected User</p>
            <h2 id="victim-name" class="font-display text-3xl font-black mb-1">Loading...</h2>
            <p id="sos-time" class="text-sm font-semibold text-gray-500 mb-6">Fetching details...</p>
            
            <div class="flex flex-col gap-4">
                <a id="btn-call" href="#" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl flex items-center justify-center gap-2 shadow-[0_4px_15px_rgba(37,99,235,0.4)] active:scale-95 transition-transform text-lg">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path></svg>
                    CALL NOW
                </a>
                <a id="btn-map" href="#" target="_blank" class="w-full py-4 bg-gray-900 hover:bg-black text-white font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-transform text-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    VIEW ON MAP
                </a>
            </div>
        </div>

        <!-- Action Response -->
        <button id="btn-respond" class="w-full py-5 bg-green-500 hover:bg-green-400 text-white text-xl font-display font-bold rounded-2xl shadow-[0_0_30px_rgba(34,197,94,0.6)] border-2 border-green-300 active:scale-95 transition-all tracking-wide">
            ✅ I'M RESPONDING
        </button>
        
        <button id="btn-silence" class="mt-8 text-sm opacity-80 hover:opacity-100 underline decoration-white/50 underline-offset-4 transition-opacity font-medium">
            Tap anywhere to silence alarm
        </button>
    </div>

    <!-- Keep the exact same JavaScript block you currently have for emergency.html here -->
    <script type="module">
        import { db, auth } from './js/config.js';
        import { doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ... (Your exact same JS code from earlier for emergency.html)
        // Note: For brevity in display, just paste the <script> logic from the previous step here. 
        // It remains 100% compatible.
    </script>
</body>
</html>
