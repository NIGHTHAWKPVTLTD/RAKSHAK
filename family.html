<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKSHAK | Connections</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Montserrat', sans-serif; }
        .glass-card { background: rgba(31, 41, 55, 0.4); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen p-6 relative">
    
    <!-- Background glow -->
    <div class="fixed top-[-100px] right-[-100px] w-[300px] h-[300px] bg-blue-900/20 rounded-full blur-[80px] pointer-events-none"></div>

    <header class="flex items-center gap-4 mb-10 relative z-10">
        <button onclick="window.location.href='dashboard.html'" class="w-10 h-10 bg-gray-800 border border-gray-700 rounded-full flex items-center justify-center active:scale-90 transition-transform">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 class="font-display text-2xl font-bold tracking-wide">Family Center</h1>
    </header>

    <main class="relative z-10 space-y-6">
        <!-- Connect a Guardian -->
        <section class="glass-card rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-[40px]"></div>
            <h2 class="font-display text-xl font-bold mb-1">Add Guardian</h2>
            <p class="text-xs text-gray-400 mb-6">Generate a code to let family receive your alerts.</p>
            
            <button id="btn-generate-code" class="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 font-bold rounded-xl active:scale-[0.98] transition-all shadow-[0_0_15px_rgba(59,130,246,0.3)] text-sm tracking-widest uppercase">
                Generate Invite Code
            </button>
            
            <div class="text-center">
                <div id="invite-code-display" class="hidden text-4xl font-display font-black tracking-[0.3em] text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300 bg-gray-900/50 py-6 rounded-xl border border-blue-500/20 mb-3 drop-shadow-md">
                    ------
                </div>
                <p id="invite-status" class="hidden text-xs text-blue-400 font-bold animate-pulse tracking-wide uppercase">Waiting for family to enter code...</p>
            </div>
        </section>

        <!-- Accept a Connection -->
        <section class="glass-card rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-32 h-32 bg-green-500/10 rounded-full blur-[40px]"></div>
            <h2 class="font-display text-xl font-bold mb-1">Accept Invite</h2>
            <p class="text-xs text-gray-400 mb-5">Enter a family member's code to protect them.</p>
            
            <div class="flex gap-3">
                <input type="text" id="input-invite-code" placeholder="6-DIGIT CODE" maxlength="6" class="flex-grow p-4 bg-black/50 border border-gray-700 rounded-xl text-white font-display font-bold uppercase text-center focus:outline-none focus:border-green-500 transition-colors tracking-[0.2em] placeholder-gray-600 text-lg">
                <button id="btn-submit-code" class="px-8 bg-gradient-to-r from-green-600 to-green-500 font-bold rounded-xl active:scale-95 transition-transform shadow-[0_0_15px_rgba(34,197,94,0.3)]">LINK</button>
            </div>
        </section>

        <!-- List of Connected Guardians -->
        <section class="mt-10">
            <h3 class="text-xs font-bold text-gray-500 mb-4 uppercase tracking-[0.15em]">Your Active Guardians</h3>
            <div id="guardian-list" class="flex flex-col gap-3">
                <p class="text-sm text-gray-600 text-center italic py-4">Loading connections...</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/family.js"></script>
</body>
</html>
