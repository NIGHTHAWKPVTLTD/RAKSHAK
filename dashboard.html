<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAKSHAK | Dashboard</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Pulse animation for SOS button */
        @keyframes emergency-pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 40px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .sos-btn { animation: emergency-pulse 2s infinite; }
        .touch-action-manipulation { touch-action: manipulation; } /* Prevents double-tap zoom on HopWeb */
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans select-none overscroll-none">

    <!-- Header -->
    <header class="flex justify-between items-center p-6 border-b border-gray-800">
        <div>
            <h1 class="text-2xl font-bold tracking-wider text-red-500">RAKSHAK</h1>
            <p class="text-xs text-gray-400">One Tap. Your Family Knows.</p>
        </div>
        <button onclick="window.location.href='family.html'" class="p-2 bg-gray-800 rounded-full">
            👥 Family
        </button>
    </header>

    <!-- Main SOS Area -->
    <main class="flex-grow flex flex-col items-center justify-center p-6">
        
        <!-- Status Indicator -->
        <div id="network-status" class="mb-8 px-4 py-2 bg-green-900/50 text-green-400 rounded-full text-sm font-semibold flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-green-500"></div> System Ready
        </div>

        <!-- The SOS Button -->
        <button id="sos-btn" class="sos-btn touch-action-manipulation w-64 h-64 bg-red-600 hover:bg-red-700 active:bg-red-800 rounded-full shadow-2xl flex flex-col items-center justify-center transition-all transform active:scale-95 z-10" aria-label="Emergency SOS - send alert to trusted family members">
            <span class="text-6xl font-extrabold tracking-widest text-white">SOS</span>
            <span class="text-sm mt-2 font-medium opacity-90 text-red-100">TAP IN EMERGENCY</span>
        </button>

        <!-- Countdown Overlay (Hidden initially) -->
        <div id="countdown-ui" class="hidden absolute inset-0 bg-gray-900/95 z-50 flex flex-col items-center justify-center p-6">
            <h2 class="text-3xl font-bold text-red-500 mb-2">ALERTING FAMILY IN</h2>
            <div id="countdown-timer" class="text-9xl font-black text-white mb-12">5</div>
            
            <div class="w-full max-w-sm flex flex-col gap-4">
                <button id="send-now-btn" class="w-full py-5 bg-red-600 text-white text-xl font-bold rounded-xl active:bg-red-700">
                    SEND NOW
                </button>
                <button id="cancel-btn" class="w-full py-5 bg-gray-700 text-white text-xl font-bold rounded-xl active:bg-gray-600">
                    CANCEL
                </button>
            </div>
        </div>

        <!-- Active SOS UI (Hidden initially) -->
        <div id="active-sos-ui" class="hidden w-full max-w-md mt-10 bg-red-900/30 border border-red-500/50 rounded-2xl p-6 text-center">
            <h3 class="text-xl font-bold text-red-400 mb-2">🚨 SOS IS ACTIVE</h3>
            <p class="text-sm text-gray-300 mb-4">Location & Alerts sent to family.</p>
            <div id="response-status" class="text-sm text-yellow-400 font-semibold mb-6">Waiting for family response...</div>
            <button id="resolve-btn" class="w-full py-4 border-2 border-red-500 text-red-500 font-bold rounded-xl active:bg-red-500/20">
                CANCEL / RESOLVE EMERGENCY
            </button>
        </div>
    </main>

    <script type="module" src="js/sos.js"></script>
</body>
</html>
