<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAKSHAK | Dashboard</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .font-display { font-family: 'Montserrat', sans-serif; }
        
        /* 3D Tactile SOS Button */
        .sos-btn-body {
            background: radial-gradient(circle at 30% 30%, #ff4b4b, #dc2626, #991b1b);
            box-shadow: 
                inset 0 4px 10px rgba(255,255,255,0.4),
                inset 0 -8px 15px rgba(0,0,0,0.4),
                0 15px 25px rgba(220, 38, 38, 0.5),
                0 0 40px rgba(220, 38, 38, 0.4);
        }
        
        /* Sonar Pulse Animation */
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.6); opacity: 0; border-width: 0px; }
        }
        .ripple-1, .ripple-2 {
            position: absolute; inset: 0; border-radius: 50%;
            border: 4px solid #ef4444; z-index: -1; pointer-events: none;
        }
        .ripple-1 { animation: ripple 2s cubic-bezier(0.15, 0.6, 0.4, 1) infinite; }
        .ripple-2 { animation: ripple 2s cubic-bezier(0.15, 0.6, 0.4, 1) infinite; animation-delay: 1s; }

        .glass-header { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col select-none overscroll-none">

    <!-- Header -->
    <header class="glass-header sticky top-0 z-40 flex justify-between items-center px-6 py-4">
        <div>
            <h1 class="text-2xl font-display font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-red-400">RAKSHAK</h1>
            <div class="flex items-center gap-2 mt-1">
                <div class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e] animate-pulse"></div>
                <p class="text-[10px] text-green-400 font-bold tracking-widest uppercase">System Armed</p>
            </div>
        </div>
        <button onclick="window.location.href='family.html'" class="p-3 bg-gray-800 border border-gray-700 hover:bg-gray-700 rounded-full transition-colors flex items-center justify-center shadow-lg active:scale-95">
            <svg class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        </button>
    </header>

    <!-- Main SOS Area -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 relative overflow-hidden">
        
        <!-- Centerpiece: The SOS Button Container -->
        <div class="relative flex items-center justify-center w-72 h-72">
            <!-- Pulsing Rings -->
            <div class="ripple-1"></div>
            <div class="ripple-2"></div>
            
            <!-- Actual Button -->
            <button id="sos-btn" class="sos-btn-body absolute w-64 h-64 rounded-full flex flex-col items-center justify-center transition-transform transform active:scale-90 z-10 cursor-pointer border-4 border-red-500/30" aria-label="Emergency SOS">
                <span class="font-display text-7xl font-black tracking-widest text-white drop-shadow-md">SOS</span>
                <span class="text-xs mt-3 font-bold opacity-90 text-red-100 tracking-[0.2em] uppercase shadow-sm">Press in Emergency</span>
            </button>
        </div>

        <p class="mt-16 text-center text-sm text-gray-500 max-w-xs font-medium">Your exact location and alert will be broadcasted immediately to your linked guardians.</p>

        <!-- Countdown Overlay -->
        <div id="countdown-ui" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 transition-opacity">
            <h2 class="font-display text-2xl font-bold text-red-500 mb-2 uppercase tracking-widest text-center">Alerting Family In</h2>
            <div id="countdown-timer" class="font-display text-[150px] font-black text-white mb-12 drop-shadow-[0_0_20px_rgba(255,255,255,0.5)] leading-none">5</div>
            
            <div class="w-full max-w-sm flex flex-col gap-4">
                <button id="send-now-btn" class="w-full py-5 bg-gradient-to-r from-red-600 to-red-500 text-white text-xl font-bold rounded-2xl active:scale-95 shadow-[0_0_20px_rgba(220,38,38,0.5)] transition-transform">
                    SEND NOW
                </button>
                <button id="cancel-btn" class="w-full py-5 bg-gray-800 border border-gray-700 text-gray-300 text-xl font-bold rounded-2xl active:scale-95 transition-transform">
                    CANCEL
                </button>
            </div>
        </div>

        <!-- Active SOS UI -->
        <div id="active-sos-ui" class="hidden w-full max-w-md mt-10 bg-gradient-to-b from-red-900/40 to-black border border-red-500/50 rounded-3xl p-8 text-center backdrop-blur-xl shadow-2xl relative z-20">
            <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse">
                <span class="text-3xl">🚨</span>
            </div>
            <h3 class="font-display text-2xl font-black text-red-400 mb-2 tracking-wide">SOS IS ACTIVE</h3>
            <p class="text-sm text-gray-300 mb-6 font-medium">Location & Alerts successfully dispatched.</p>
            
            <div id="response-status" class="bg-black/50 border border-gray-700 rounded-xl p-4 text-sm text-yellow-400 font-bold mb-8 flex items-center justify-center gap-2">
                <svg class="animate-spin h-5 w-5 text-yellow-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Waiting for guardian response...
            </div>
            
            <button id="resolve-btn" class="w-full py-4 border-2 border-gray-600 text-gray-300 hover:border-red-500 hover:text-red-500 font-bold rounded-xl active:scale-95 transition-all text-sm uppercase tracking-widest">
                Cancel / Resolve Emergency
            </button>
        </div>
    </main>

    <script type="module" src="js/sos.js"></script>
</body>
</html>
