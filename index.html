<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAKSHAK | Login</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, .font-display { font-family: 'Montserrat', sans-serif; }
        .glass-panel { background: rgba(31, 41, 55, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-field { transition: all 0.3s ease; }
        .input-field:focus { box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.5); border-color: #ef4444; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-black to-gray-900 text-white min-h-screen flex flex-col justify-center items-center p-6 relative overflow-hidden">

    <!-- Decorative Background Glow -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-red-600/20 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md glass-panel rounded-3xl shadow-2xl p-8 relative z-10">
        <!-- Brand -->
        <div class="text-center mb-10">
            <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-red-400 tracking-wider mb-2 drop-shadow-lg">RAKSHAK</h1>
            <p class="text-gray-400 text-sm font-medium tracking-widest uppercase">One Tap. Your Family Knows.</p>
        </div>

        <!-- Auth Forms -->
        <div id="auth-container">
            <!-- Login Form -->
            <form id="login-form" class="flex flex-col gap-5">
                <div>
                    <label class="text-xs text-gray-400 font-bold tracking-wide mb-1 block">EMAIL ADDRESS</label>
                    <input type="email" id="login-email" required class="input-field w-full p-4 bg-black/40 border border-gray-700 rounded-xl text-white outline-none placeholder-gray-500" placeholder="you@example.com">
                </div>
                <div>
                    <label class="text-xs text-gray-400 font-bold tracking-wide mb-1 block">PASSWORD</label>
                    <input type="password" id="login-password" required class="input-field w-full p-4 bg-black/40 border border-gray-700 rounded-xl text-white outline-none placeholder-gray-500" placeholder="••••••••">
                </div>
                <button type="submit" id="btn-login" class="w-full py-4 mt-4 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 active:scale-[0.98] text-white font-bold rounded-xl shadow-[0_0_20px_rgba(220,38,38,0.4)] transition-all uppercase tracking-widest">
                    Secure Login
                </button>
                <p class="text-center text-sm text-gray-400 mt-4">
                    New to Rakshak? <a href="#" id="toggle-register" class="text-red-400 font-bold hover:text-red-300 transition-colors">Create Account</a>
                </p>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="flex flex-col gap-4 hidden animate-[fadeIn_0.3s_ease-out]">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="text-xs text-gray-400 font-bold tracking-wide mb-1 block">FULL NAME</label>
                        <input type="text" id="reg-name" required class="input-field w-full p-4 bg-black/40 border border-gray-700 rounded-xl text-white outline-none placeholder-gray-500" placeholder="John Doe">
                    </div>
                    <div class="col-span-2">
                        <label class="text-xs text-gray-400 font-bold tracking-wide mb-1 block">PHONE NUMBER</label>
                        <input type="tel" id="reg-phone" required class="input-field w-full p-4 bg-black/40 border border-gray-700 rounded-xl text-white outline-none placeholder-gray-500" placeholder="+1 234 567 8900">
                    </div>
                    <div class="col-span-2">
                        <label class="text-xs text-gray-400 font-bold tracking-wide mb-1 block">EMAIL ADDRESS</label>
                        <input type="email" id="reg-email" required class="input-field w-full p-4 bg-black/40 border border-gray-700 rounded-xl text-white outline-none placeholder-gray-500" placeholder="you@example.com">
                    </div>
                    <div class="col-span-2">
                        <label class="text-xs text-gray-400 font-bold tracking-wide mb-1 block">PASSWORD</label>
                        <input type="password" id="reg-password" required minlength="6" class="input-field w-full p-4 bg-black/40 border border-gray-700 rounded-xl text-white outline-none placeholder-gray-500" placeholder="Min 6 characters">
                    </div>
                </div>
                <button type="submit" id="btn-register" class="w-full py-4 mt-2 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 active:scale-[0.98] text-white font-bold rounded-xl shadow-[0_0_20px_rgba(220,38,38,0.4)] transition-all uppercase tracking-widest">
                    Register Account
                </button>
                <p class="text-center text-sm text-gray-400 mt-4">
                    Already registered? <a href="#" id="toggle-login" class="text-red-400 font-bold hover:text-red-300 transition-colors">Log In</a>
                </p>
            </form>
        </div>
        
        <p id="auth-error" class="bg-red-900/50 border border-red-500 text-red-200 text-sm p-3 rounded-lg text-center font-semibold mt-6 hidden"></p>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
